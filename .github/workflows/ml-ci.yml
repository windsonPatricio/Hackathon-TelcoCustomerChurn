name: ML Model API CI

on:
  push:
    branches:
      - dev # Roda apenas quando o código já foi mergeado na dev
    paths:
      - 'ml/model_api/**'
  pull_request:
    branches:
      - dev # Roda para validar qualquer branch tentando entrar na dev
    paths:
      - 'ml/model_api/**'

# Controla concorrência para evitar execuções duplicadas em pushes rápidos
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-checks:
    name: QA Checks
    runs-on: ubuntu-latest
    
    # Define o diretório padrão para comandos de terminal (run)
    defaults:
      run:
        working-directory: ./ml/model_api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Configura o Python usando o arquivo .python-version
      # Isso usa o cache do GitHub Actions para o binário do Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "ml/model_api/.python-version"

      # 2. Instala o UV (versão pinada) e habilita cache de dependências
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.3"
          enable-cache: true
          cache-dependency-glob: "ml/model_api/uv.lock"

      # 3. Sincroniza o ambiente
      # O uv vai detectar automaticamente o Python configurado no passo anterior
      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      # 4. Roda os testes
      - name: Run Tests
        run: uv run pytest tests -v
        
# Job para checar se a imagem Docker builda corretamente
  docker-build-check:
    name: Dry Run Docker Build
    needs: qa-checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Configura o Buildx (necessário para cache avançado)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builda usando cache do GitHub Actions
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          # Define o contexto do build (onde está o Dockerfile)
          context: ./ml/model_api
          file: ./ml/model_api/Dockerfile
          push: false # Apenas valida o build, não sobe para registry
          tags: model-api:test
          # Configuração de Cache
          cache-from: type=gha
          cache-to: type=gha,mode=max