name: Backend Java CI

on:
  push:
    branches:
      - dev
      - "backend/**"
    paths:
      - "api-backend/**" # Só roda se houver mudanças na pasta do Java

  pull_request:
    branches:
      - dev
    paths:
      - "api-backend/**"

jobs:
  build-and-test:
    name: Build and Test Java
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./api-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run Unit Tests
        run: ./mvnw clean test
        env:
          # Injeta a variável necessária para o Spring não falhar no boot
          API_BASE_URL: http://localhost:8000
