<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReterMais - Formulário de Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-light">

<div id="tela-home" class="tela show">
<div class="container py-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Dados do Usuario</h4>
        </div>
        <div class="card-body">
            <form action="#" method="POST">

                <h5 class="mb-3 text-secondary border-bottom pb-2">Dados do Cliente e Contrato</h5>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="genero" class="form-label">Gênero</label>
                        <select class="form-select" id="genero" name="genero">
                            <option value="homem" selected>Homem</option>
                            <option value="mulher">Mulher</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label for="idoso" class="form-label">Idoso</label>
                        <select class="form-select" id="idoso" name="idoso" required>
                            <option value= "" selected disabled hidden > Selecione...</option>
                            <option value="0">Não</option>
                            <option value="1">Sim</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="parceiro" class="form-label">Parceiro</label>
                        <select class="form-select" id="parceiro" name="parceiro">
                            <option value="0">Não</option>
                            <option value="1" selected>Sim</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="dependentes" class="form-label">Dependentes</label>
                        <select class="form-select" id="dependentes" name="dependentes">
                            <option value="0" selected>Não</option>
                            <option value="1">Sim</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="tempo_contrato_meses" class="form-label">Tempo de Contrato (Meses)</label>
                        <input type="number" class="form-control" id="tempo_contrato_meses" name="tempo_contrato_meses">
                    </div>

                    <div class="col-md-6">
                        <label for="tipo_contrato" class="form-label">Tipo de Contrato</label>
                        <select class="form-select" id="tipo_contrato" name="tipo_contrato">
                            <option value="mensal" selected>Mensal</option>
                            <option value="um_ano">Um Ano</option>
                            <option value="dois_anos">Dois Anos</option>
                        </select>
                    </div>
                </div>

                <h5 class="mt-4 mb-3 text-secondary border-bottom pb-2">Serviços</h5>
                <div class="row g-3">

                    <div class="col-md-4">
                        <label for="servico_telefone" class="form-label">Serviço de Telefone</label>
                        <select class="form-select" id="servico_telefone" name="servico_telefone">
                            <option value="0">Não</option>
                            <option value="1" selected>Sim</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="linhas_multiplas" class="form-label">Linhas Múltiplas</label>
                        <select class="form-select" id="linhas_multiplas" name="linhas_multiplas">
                            <option value="nao" selected>Não</option>
                            <option value="sim">Sim</option>
                            <option value="sem_telefone">Sem Telefone</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="tipo_internet" class="form-label">Tipo de Internet</label>
                        <select class="form-select" id="tipo_internet" name="tipo_internet">
                            <option value="dsl">DSL</option>
                            <option value="fibra" selected>Fibra</option>
                            <option value="sem_internet">Sem Internet</option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mt-1">
                    <div class="col-md-4">
                        <label for="seguranca_online" class="form-label">Segurança Online</label>
                        <select class="form-select" id="seguranca_online" name="seguranca_online">
                            <option value="nao">Não</option>
                            <option value="sim" selected>Sim</option>
                            <option value="sem_internet">Sem Internet</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="backup_online" class="form-label">Backup Online</label>
                        <select class="form-select" id="backup_online" name="backup_online">
                            <option value="nao" selected>Não</option>
                            <option value="sim">Sim</option>
                            <option value="sem_internet">Sem Internet</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="protecao_dispositivo" class="form-label">Proteção de Dispositivo</label>
                        <select class="form-select" id="protecao_dispositivo" name="protecao_dispositivo">
                            <option value="nao" selected>Não</option>
                            <option value="sim">Sim</option>
                            <option value="sem_internet">Sem Internet</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="suporte_tecnico" class="form-label">Suporte Técnico</label>
                        <select class="form-select" id="suporte_tecnico" name="suporte_tecnico">
                            <option value="nao" selected>Não</option>
                            <option value="sim">Sim</option>
                            <option value="sem_internet">Sem Internet</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="streaming_tv" class="form-label">Streaming TV</label>
                        <select class="form-select" id="streaming_tv" name="streaming_tv">
                            <option value="nao">Não</option>
                            <option value="sim" selected>Sim</option>
                            <option value="sem_internet">Sem Internet</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="streaming_filmes" class="form-label">Streaming Filmes</label>
                        <select class="form-select" id="streaming_filmes" name="streaming_filmes">
                            <option value="nao">Não</option>
                            <option value="sim" selected>Sim</option>
                            <option value="sem_internet">Sem Internet</option>
                        </select>
                    </div>
                </div>

                <h5 class="mt-4 mb-3 text-secondary border-bottom pb-2">Faturamento</h5>
                <div class="row g-3">

                    <div class="col-md-3">
                        <label for="cobranca_digital" class="form-label">Cobrança Digital</label>
                        <select class="form-select" id="cobranca_digital" name="cobranca_digital">
                            <option value="0">Não</option>
                            <option value="1" selected>Sim</option>
                        </select>
                    </div>

                    <div class="col-md-9">
                        <label for="metodo_pagamento" class="form-label">Método de Pagamento</label>
                        <select class="form-select" id="metodo_pagamento" name="metodo_pagamento">
                            <option value="cheque_eletronico" selected>Cheque Eletrônico</option>
                            <option value="cartao_credito_automatica">Cartão de Crédito (Automático)</option>
                            <option value="transferencia_bancaria_automatica">Transferência Bancária (Automática)</option>
                            <option value="cheque_enviado">Cheque Enviado</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="cobranca_mensal" class="form-label">Cobrança Mensal (R$)</label>
                        <div class="input-group">
                            <span class="input-group-text">R$</span>
                            <input type="number" step="0.01" class="form-control" id="cobranca_mensal" name="cobranca_mensal">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="cobranca_total" class="form-label">Cobrança Total (R$)</label>
                        <div class="input-group">
                            <span class="input-group-text">R$</span>
                            <input type="number" step="0.01" class="form-control" id="cobranca_total" name="cobranca_total">
                        </div>
                    </div>
                </div>

                <div class="mt-4 d-flex justify-content-end">
                    <button type="submit"  class="btn btn-primary btn-lg" >Realizar previsão</button>
                </div>

            </form>
        </div>
    </div>
</div>
</div>

<div id="tela-resposta" class="tela collapse">
    <label id="resposta-previsao">previsao</label><br>
    <label id="resposta-probabilidade">probabilidade</label><br>
    <button class="btn btn-secondary" onclick="reiniciarApp()">Nova Previsão</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="./js/api.js"></script>
<script>
    // seleciona o formulario e adiciona o evento
    document.querySelector('form').addEventListener('submit', async function(event) {
        event.preventDefault(); // impede o formulário de recarregar a pagina
        await preverCancelamento();
    });
</script>
<script type="module" src="js/util.js"></script>
</body>
</html>
